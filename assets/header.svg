<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080f1d" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.6)" />
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.1)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
  </defs>

  <!-- Main Card Container -->
  <rect x="5" y="5" width="940" height="240" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="50" r="100" fill="#00f0ff" opacity="0.08" filter="url(#glow)" />
  <circle cx="820" cy="190" r="120" fill="#818cf8" opacity="0.09" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="50" x2="950" y2="50" />
    <line x1="0" y1="100" x2="950" y2="100" />
    <line x1="0" y1="150" x2="950" y2="150" />
    <line x1="0" y1="200" x2="950" y2="200" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="400" y1="0" x2="400" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
    <line x1="800" y1="0" x2="800" y2="250" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <circle cx="15" cy="14" r="4.5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">● ECOSYSTEM ACTIVE</text>
  </g>

  <!-- Location / University Pill -->
  <g transform="translate(670, 42)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(129, 140, 248, 0.08)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="110" y="18" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">UNIVERSIDAD DE CUENCA 🇪🇨</text>
  </g>

  <!-- Title / Name -->
  <text x="60" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Christian Muñoz
  </text>

  <!-- Role Gradient Subtitle -->
  <text x="60" y="162" fill="url(#cyanGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="0.5">
    Founder &amp; Tech Lead @ BalzAI Platform
  </text>

  <!-- Mission Statement -->
  <text x="60" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Autonomous AI Architectures · GraphRAG Memory Engines · Distributed High-Availability Microservices
  </text>

  <!-- Bottom Accent Line -->
  <rect x="60" y="215" width="830" height="2" rx="1" fill="url(#cyanGradient)" opacity="0.8" />
</svg>
